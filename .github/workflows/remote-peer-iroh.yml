name: Remote Peer Iroh prebuilt compatibility

on:
  pull_request:
    paths:
      - 'BUN_VERSION'
      - 'addons/remote-peer/**'
      - '.github/workflows/remote-peer-iroh.yml'
  push:
    branches: [main]
    paths:
      - 'BUN_VERSION'
      - 'addons/remote-peer/**'
      - '.github/workflows/remote-peer-iroh.yml'

jobs:
  prebuilt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: addons/remote-peer
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../../BUN_VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - name: Install prebuilt runtime dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --omit peer --ignore-scripts
      - name: Import official Iroh native binding
        run: bun -e "const { iroh } = await import('./transport.ts'); const api = iroh(); if (typeof api.Endpoint?.builder !== 'function' || typeof api.SecretKey?.generate !== 'function') throw new Error('Iroh prebuilt API unavailable'); console.log(process.platform, process.arch, 'Iroh prebuilt import OK')"
      - name: Run client ID and fresh-state tests
        run: bun test config.test.ts iroh.test.ts --test-name-pattern 'client IDs|fresh state|default-off'
