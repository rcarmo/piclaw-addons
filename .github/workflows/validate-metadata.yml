name: validate-metadata

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Bun version
        id: bun-version
        run: |
          version="$(tr -d '[:space:]' < BUN_VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Validate catalog and root package metadata
        run: bun run check:catalog

      - name: Test public package builder
        run: bun test build.test.ts

      - name: Install Iroh prebuilt test dependency
        run: |
          # Avoid resolving remote-peer's wildcard Pi peer from a transient latest
          # registry release. Only Iroh/Bonjour are needed; root pins supply Pi.
          mkdir -p .tmp/iroh-test
          bun -e 'const p=await Bun.file("addons/remote-peer/package.json").json(); await Bun.write(".tmp/iroh-test/package.json",JSON.stringify({private:true,dependencies:p.dependencies}))'
          bun install --cwd .tmp/iroh-test --ignore-scripts
          ln -s "$PWD/.tmp/iroh-test/node_modules" addons/remote-peer/node_modules
      - name: Type-check Earendil compatibility surface
        run: bun run typecheck:earendil-compat

      - name: Test Earendil compatibility surface
        run: bun run test:earendil-compat

      - name: Test standalone add-on imports
        run: bun test standalone-import.test.ts
      - name: Test Iroh-only Remote Peer on isolated loopback
        run: bun test addons/remote-peer

      - name: Validate package can be packed
        run: bun pm pack --dry-run >/dev/null

  delegate-proxy-103:
    # Ubuntu 24+ runner AppArmor restricts unprivileged uid_map writes. The
    # production launcher fails closed there; qualify rootless namespaces on 22.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Bun version
        id: bun-version
        run: echo "version=$(tr -d '[:space:]' < BUN_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - run: bun install --frozen-lockfile
      - name: Prepare isolated public Pi 1.0.3 packages
        run: |
          mkdir -p .tmp/proxy103-sdk .tmp/proxy103-archives
          bun -e 'await Bun.write(".tmp/proxy103-sdk/package.json", JSON.stringify({private:true,type:"module",dependencies:{"@earendil-works/pi-ai":"1.0.3","@earendil-works/pi-coding-agent":"1.0.3"}}))'
          bun install --cwd .tmp/proxy103-sdk --ignore-scripts
          for name in pi-ai pi-coding-agent; do
            curl --fail --silent --show-error --location "https://registry.npmjs.org/@earendil-works/$name/-/$name-1.0.3.tgz" -o ".tmp/proxy103-archives/$name-1.0.3.tgz"
          done
      - name: Qualify private pipes and public agent loop without network
        run: |
          sudo unshare --net --fork setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            /usr/bin/env -i PATH=/usr/bin:/bin HOME=/tmp PICLAW_DELEGATE_CONFINEMENT_TEST=1 "$(command -v bun)" --no-env-file \
            "$PWD/scripts/qualification/delegate-proxy-103-check.ts" "$PWD/.tmp/proxy103-sdk" "$PWD/.tmp/proxy103-archives" "$PWD/.tmp/proxy103-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: delegate-proxy-103
          path: |
            .tmp/proxy103-evidence/*.log
            .tmp/proxy103-evidence/receipt.json

  late-night-regrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Bun version
        id: bun-version
        run: echo "version=$(tr -d '[:space:]' < BUN_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun test addons/late-night-regrets

  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve Bun version
        id: bun-version
        run: echo "version=$(tr -d '[:space:]' < BUN_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd addons/code-review --frozen-lockfile

      - name: Install Chromium
        working-directory: addons/code-review
        run: bunx playwright install --with-deps chromium

      - name: Run Code Review regression and browser tests
        run: |
          # Preloads replace HOME for isolation; use the explicit job cache.
          bun test addons/code-review
          bunx tsc -p addons/code-review/tsconfig.json

      - name: Validate standalone production package
        working-directory: addons/code-review
        run: bun pm pack --dry-run
