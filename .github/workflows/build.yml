name: Build & deploy docs + tarballs

# This workflow publishes the GitHub Pages site and the public add-on tarballs
# under docs/packages/. It must run whenever an add-on package changes,
# especially package.json version bumps.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validation:
    uses: ./.github/workflows/validate-metadata.yml

  build:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pin browser cache before isolating HOME
        # GITHUB_ENV keeps install and lookup aligned after HOME/XDG_CACHE_HOME change.
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/piclaw-addon-playwright" >> "$GITHUB_ENV"
      - name: Resolve Bun version
        id: bun-version
        run: |
          version="$(tr -d '[:space:]' < BUN_VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - name: Install add-on repository dependencies
        run: bun install --frozen-lockfile
      - name: Validate catalog and publication contracts
        id: catalog
        run: |
          bun run check:catalog
          bun test publication.test.ts
      - name: Record validated source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > publication-source.txt
      - name: Detect add-on UX tests
        id: addon_tests
        run: |
          if [ -n "$SELECTED_ADDONS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SELECTED_ADDONS: ${{ needs.validation.outputs.ux }}
      - name: Checkout Piclaw runtime for add-on UX tests
        if: steps.addon_tests.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: rcarmo/piclaw
          ref: e4c2b9a3536eb64361da86237a4dfc970d772682 # Piclaw v3.3.0
          path: .piclaw-runtime
      - name: Install Piclaw runtime dependencies
        if: steps.addon_tests.outputs.present == 'true'
        run: bun install --frozen-lockfile
        working-directory: .piclaw-runtime
      - name: Build Piclaw web assets for add-on UX tests
        if: steps.addon_tests.outputs.present == 'true'
        run: bun run build:web
        working-directory: .piclaw-runtime
      - name: Install add-on UX test dependencies
        if: steps.addon_tests.outputs.present == 'true'
        run: bun install --frozen-lockfile
        working-directory: tests/addon-e2e
      - name: Install Playwright browser for add-on UX tests
        if: steps.addon_tests.outputs.present == 'true'
        run: bunx playwright install chromium
        working-directory: tests/addon-e2e
      - name: Start Piclaw add-on UX test instance
        if: steps.addon_tests.outputs.present == 'true'
        run: |
          export PICLAW_INTERNAL_SECRET=$(openssl rand -hex 16)
          echo "::add-mask::$PICLAW_INTERNAL_SECRET"
          echo "PICLAW_INTERNAL_SECRET=$PICLAW_INTERNAL_SECRET" >> "$GITHUB_ENV"
          export PICLAW_KEYCHAIN_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$PICLAW_KEYCHAIN_KEY"
          echo "PICLAW_KEYCHAIN_KEY=$PICLAW_KEYCHAIN_KEY" >> "$GITHUB_ENV"
          export PICLAW_WEB_PORT=3000
          export PICLAW_WEB_HOST=127.0.0.1

          # Preparation owns the root. Consume only its explicit path fields, never eval output.
          prepared=$(PICLAW_ADDON=all PICLAW_RUNTIME_ROOT="$GITHUB_WORKSPACE/.piclaw-runtime/runtime" bun run tests/addon-e2e/scripts/prepare-addon-test-instance.ts)
          while IFS='=' read -r name value; do
            case "$name" in
              PICLAW_PREP_ROOT|PICLAW_WORKSPACE|HOME|PICLAW_STORE|PICLAW_DATA|PICLAW_PI_AGENT_DIR|PI_CODING_AGENT_DIR|XDG_CONFIG_HOME|XDG_CACHE_HOME|XDG_DATA_HOME|TMPDIR|TMP|TEMP)
                export "$name=$value"
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done <<< "$prepared"
          test -n "$PICLAW_PREP_ROOT" && test -d "$PICLAW_WORKSPACE"

          # Prepared packages are source copies. Install Remote Peer's exact
          # runtime dependencies inside the disposable fixture without requiring
          # an add-on-local lockfile, using the test server's sanitised environment.
          remote_peer_dir="$PICLAW_WORKSPACE/.pi/extensions/node_modules/@rcarmo/piclaw-addon-remote-peer"
          test ! -e "$remote_peer_dir/bun.lock" && test ! -e "$remote_peer_dir/bun.lockb"
          test ! -L "$remote_peer_dir/node_modules"
          peer_json="$PICLAW_PREP_ROOT/node_modules/@earendil-works/pi-ai/package.json"
          partial_json="$PICLAW_PREP_ROOT/node_modules/partial-json/package.json"
          peer_before=$(sha256sum "$peer_json" "$partial_json")
          bun run scripts/run-test-instance.ts -- \
            bun install --cwd "$remote_peer_dir" --omit peer --ignore-scripts
          test "$peer_before" = "$(sha256sum "$peer_json" "$partial_json")"
          bun run scripts/run-test-instance.ts -- \
            bun --no-env-file tests/addon-e2e/scripts/check-prepared-dependencies.ts

          PICLAW_E2E_INTERNAL_SECRET="$PICLAW_INTERNAL_SECRET" PICLAW_E2E_KEYCHAIN_KEY="$PICLAW_KEYCHAIN_KEY" \
            bun run scripts/run-test-instance.ts -- bun run .piclaw-runtime/runtime/src/index.ts > /tmp/piclaw-addon-e2e.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"

          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Piclaw did not become ready" >&2
          cat /tmp/piclaw-addon-e2e.log >&2 || true
          exit 1
      - name: Run add-on UX tests
        id: ux
        if: steps.addon_tests.outputs.present == 'true'
        run: bun run test -- --project=desktop-chrome
        working-directory: tests/addon-e2e
        env:
          PICLAW_ADDON: ${{ needs.validation.outputs.ux }}
          PICLAW_E2E_URL: http://localhost:3000
          PICLAW_E2E_DISPOSABLE: '1'
          PICLAW_E2E_INTERNAL_SECRET: ${{ env.PICLAW_INTERNAL_SECRET }}
      - name: Generate add-on UX PDF reports
        if: always() && steps.addon_tests.outputs.present == 'true' && hashFiles('tests/addon-e2e/reports/results.json') != ''
        run: bun run report
        working-directory: tests/addon-e2e
      - name: Upload add-on UX reports
        if: always() && steps.addon_tests.outputs.present == 'true' && hashFiles('addons/*/tests/reports/results.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: addon-ux-reports
          path: |
            addons/*/tests/reports/*-ux-report.pdf
            addons/*/tests/reports/*-ux-report.html
            addons/*/tests/reports/results.json
          retention-days: 14
      - name: Stop Piclaw add-on UX test instance
        if: always() && steps.addon_tests.outputs.present == 'true'
        run: kill $SERVER_PID 2>/dev/null || true
      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: publication-failure-diagnostics
          path: |
            publication-source.txt
            /tmp/piclaw-addon-e2e.log
            tests/addon-e2e/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Require completed publication gates
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CATALOG_OUTCOME: ${{ steps.catalog.outcome }}
          UX_REQUIRED: ${{ steps.addon_tests.outputs.present }}
          UX_OUTCOME: ${{ steps.ux.outcome }}
        run: |
          test "$CATALOG_OUTCOME" = success
          case "$UX_REQUIRED:$UX_OUTCOME" in
            true:success|false:skipped) ;;
            *) echo "Missing or unsuccessful required publication gate" >&2; exit 1 ;;
          esac
      - name: Build site and package tarballs
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bun run build.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Copy assets into docs
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/assets
          cp -r assets/* docs/assets/
          cp publication-source.txt docs/publication-source.txt
      - name: Deploy to GitHub Pages
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
