name: Publish archive packages to GitHub Packages

on:
  workflow_run:
    workflows: ["Build & deploy docs + tarballs"]
    types: [completed]
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# NOTE: runtime install/remove must not depend on this registry.
# First-party piclaw add-ons install from the public GitHub Pages tarball URLs
# generated into catalog.json and docs/packages/. This workflow is archival /
# alternate-consumption only.
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Verify validated source
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"

      - name: Resolve Bun version
        id: bun-version
        run: |
          version="$(tr -d '[:space:]' < BUN_VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Set up npm for archival GitHub Packages publish
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          echo "@rcarmo:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Publish version-bumped addons
        run: |
          set -euo pipefail
          for dir in addons/*/; do
            [ -f "$dir/package.json" ] || continue
            slug=$(basename "$dir")
            OLD_VER=$(git show HEAD~1:"${dir}package.json" 2>/dev/null | bun -e "
              const d=JSON.parse(await Bun.stdin.text()); console.log(d.version||'')" 2>/dev/null || echo "")
            NEW_VER=$(bun -e "console.log(require('./${dir}package.json').version)")
            if [ "$OLD_VER" = "$NEW_VER" ] || [ -z "$NEW_VER" ]; then
              continue
            fi
            echo "→ $slug: $OLD_VER → $NEW_VER — publishing"
            cd "$dir"
            npm publish --registry https://npm.pkg.github.com 2>&1 | tail -3
            cd ../..
          done
