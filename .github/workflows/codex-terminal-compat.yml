name: Codex terminal compatibility

on:
  pull_request:
    paths:
      - 'BUN_VERSION'
      - 'addons/codex-conversion/**'
      - '.github/workflows/codex-terminal-compat.yml'
  push:
    branches: [main]
    paths:
      - 'BUN_VERSION'
      - 'addons/codex-conversion/**'
      - '.github/workflows/codex-terminal-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-compat:
    name: Bun.Terminal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < BUN_VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Run Bun.Terminal manager and lifecycle tests
        run: bun test --max-concurrency=1 addons/codex-conversion/src/tools/exec-session-manager.test.ts addons/codex-conversion/src/tools/pty-backend.test.ts
      - name: Typecheck Earendil compatibility
        run: bun run typecheck:earendil-compat
